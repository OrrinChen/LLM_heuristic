[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-or-heuristic-discovery"
version = "0.1.0"
description = "Sandboxed LLM-driven program search for OR heuristics and PIT trading rules."
requires-python = ">=3.9"
dependencies = []

[project.scripts]
heuristic-discovery = "heuristic_discovery.__main__:main"

[project.optional-dependencies]
dev = [
  "pytest>=7",
  "ruff>=0.4",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["UP006", "UP007", "UP035", "UP037", "UP045"]
